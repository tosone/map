on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  linux-build:
    name: Create Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Dockerfile
        run: docker build --build-arg VERSION="${{ github.ref_name }}" -t map:dev .

      # docker cp only works on containers: create one from the image without
      # starting it, copy the two static binaries out of /usr/local/bin, then
      # remove the container.
      - name: Copy files out of the image
        run: |
          mkdir -p dist
          container=$(docker create map:dev)
          docker cp "$container:/usr/local/bin/map-amd64" dist/map-amd64
          docker cp "$container:/usr/local/bin/map-arm64v8" dist/map-arm64v8
          docker rm "$container"
          ls -lh dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-linux
          path: ./dist/*
          retention-days: 5

  create-github-release:
    needs:
      - linux-build
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Set env
        run: echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Hash file
        id: hash
        run: |
          echo "amd64=$(sha256sum map-linux/map-amd64 | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
          echo "arm64v8=$(sha256sum map-linux/map-arm64v8 | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Size
        id: size
        run: |
          echo "amd64=$(ls -lh map-linux/map-amd64 | awk '{ print $5 }')" >> "$GITHUB_OUTPUT"
          echo "arm64v8=$(ls -lh map-linux/map-arm64v8 | awk '{ print $5 }')" >> "$GITHUB_OUTPUT"

      # this action creates the release and uploads the assets in one step;
      # actions/create-release has been archived since 2021 and a second
      # action was used only to upload the files
      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Download asset which is static compiled, run it anywhere on Linux.

            |File|Size|SHA256|
            |:---|:---|:---|
            |[map-amd64](https://github.com/tosone/map/releases/download/${{ env.GIT_TAG }}/map-amd64)|${{ steps.size.outputs.amd64 }}|`${{ steps.hash.outputs.amd64 }}`|
            |[map-arm64v8](https://github.com/tosone/map/releases/download/${{ env.GIT_TAG }}/map-arm64v8)|${{ steps.size.outputs.arm64v8 }}|`${{ steps.hash.outputs.arm64v8 }}`|
          files: |
            map-linux/map-amd64
            map-linux/map-arm64v8
